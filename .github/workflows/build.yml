name: Build RemonteVoice

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    name: Test and package Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -c "import remontevoice"
        working-directory: host

      - name: Check Python sources
        run: python -m compileall -q remontevoice ..\tests
        working-directory: host

      - name: Run host tests
        timeout-minutes: 15
        env:
          PYTHONPATH: ${{ github.workspace }}\host
        run: python run_tests.py
        working-directory: host

      - name: Package Windows host
        # Keep the recovery helper a single independent process, without a
        # onefile extraction supervisor sharing the owner's temporary files.
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name RemonteVoice --paths . --specpath build --workpath build\work
          --distpath build\dist --collect-all qrcode --collect-all PIL
          --collect-all soundcard --hidden-import websockets.asyncio.server
          launcher.py
        working-directory: host

      - uses: actions/upload-artifact@v7
        with:
          name: RemonteVoice-Windows
          path: host/build/dist/RemonteVoice/
          if-no-files-found: error

  ios-build:
    name: Build iOS targets on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check strict pairing endpoint fixtures
        working-directory: ios
        run: |
          swiftc RemonteVoice/PairingInfo.swift tests/PairingInfoProbe.swift -o "$RUNNER_TEMP/RemonteVoicePairingProbe"
          "$RUNNER_TEMP/RemonteVoicePairingProbe"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: ios

      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project RemonteVoice.xcodeproj -scheme RemonteVoice
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/RemonteVoiceSimulator"
          CODE_SIGNING_ALLOWED=NO build
        working-directory: ios

      - name: Build unsigned iPhone app
        run: >-
          xcodebuild -project RemonteVoice.xcodeproj -scheme RemonteVoice
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/RemonteVoiceDevice"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        working-directory: ios

      - name: Package unsigned iPhone IPA for AltServer
        run: |
          mkdir -p "$RUNNER_TEMP/RemonteVoiceIPA/Payload"
          ditto "$RUNNER_TEMP/RemonteVoiceDevice/Build/Products/Release-iphoneos/RemonteVoice.app" \
            "$RUNNER_TEMP/RemonteVoiceIPA/Payload/RemonteVoice.app"
          cd "$RUNNER_TEMP/RemonteVoiceIPA"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/RemonteVoice-iPhone-unsigned.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: RemonteVoice-iOS-Simulator
          path: ${{ runner.temp }}/RemonteVoiceSimulator/Build/Products/Release-iphonesimulator/RemonteVoice.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: RemonteVoice-iPhone-unsigned
          path: ${{ runner.temp }}/RemonteVoiceDevice/Build/Products/Release-iphoneos/RemonteVoice.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: RemonteVoice-iPhone-unsigned-IPA
          path: ${{ runner.temp }}/RemonteVoice-iPhone-unsigned.ipa
          if-no-files-found: error
