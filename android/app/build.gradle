plugins { id 'com.android.application' }

// Release credentials are supplied only by an explicit owner-controlled build.
// The local debug keystore/configuration remains independent of this identity.
def releaseSigningEnvironment = [
    storeFile: System.getenv('REMONTEVOICE_RELEASE_STORE_FILE'),
    storePassword: System.getenv('REMONTEVOICE_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('REMONTEVOICE_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('REMONTEVOICE_RELEASE_KEY_PASSWORD'),
    certificateSha256: System.getenv('REMONTEVOICE_RELEASE_CERT_SHA256')
]
def hasReleaseSigning = releaseSigningEnvironment.values().any { it != null && !it.isEmpty() }
if (hasReleaseSigning && !releaseSigningEnvironment.values().every { it != null && !it.isEmpty() }) {
    throw new GradleException('Incomplete RemonteVoice release signing environment')
}
def expectedReleaseCertificate = hasReleaseSigning ? releaseSigningEnvironment.certificateSha256
        .replace(':', '').trim().toLowerCase(Locale.ROOT) : null
if (hasReleaseSigning && !(expectedReleaseCertificate ==~ /[0-9a-f]{64}/)) {
    throw new GradleException('Invalid configured release certificate SHA-256')
}

android {
    namespace 'dev.remontevoice.android'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.remontevoice.android'
        minSdk 26
        targetSdk 36
        versionCode 41
        versionName '0.1.40'
        testInstrumentationRunner 'dev.remontevoice.android.ViewerInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = false }
}

def verifyReleaseSigningIdentity = tasks.register('verifyReleaseSigningIdentity') {
    doLast {
        if (!hasReleaseSigning) { return }
        String actualCertificate
        try {
            def keyStore = java.security.KeyStore.getInstance(
                    file(releaseSigningEnvironment.storeFile), releaseSigningEnvironment.storePassword.toCharArray())
            if (!keyStore.isKeyEntry(releaseSigningEnvironment.keyAlias)) {
                throw new IllegalArgumentException('Missing key entry')
            }
            def certificate = keyStore.getCertificate(releaseSigningEnvironment.keyAlias)
            actualCertificate = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(certificate.encoded).encodeHex().toString()
        } catch (Exception ignored) {
            // Keystore/alias/password errors must not expose supplied secrets.
            throw new GradleException('Unable to verify configured release signing certificate')
        }
        if (actualCertificate != expectedReleaseCertificate) {
            throw new GradleException('Release certificate fingerprint does not match the configured identity')
        }
        logger.lifecycle('Release signer SHA-256: ' + actualCertificate)
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyReleaseSigningIdentity
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // The scanner 4.3.0 POM omits its implementation dependencies; pin its upstream versions.
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
