name: Build Android RemoteVoice

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Check client and build unsigned release
        working-directory: android
        run: gradle --no-daemon --no-configuration-cache --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Describe unsigned artifact (not an installable update)
        shell: pwsh
        run: ./android/scripts/signing-manifest.ps1 -ApkPath android/app/build/outputs/apk/release/app-release-unsigned.apk -OutputDirectory android/build/unsigned-release-artifact -Unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: RemoteVoice-Android-unsigned-release-not-installable
          path: android/build/unsigned-release-artifact/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: RemoteVoice-Android-checks
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*

  signed-release-candidate:
    needs: android
    # Forks and every PR stay on the unsigned path. The owner must opt in, then
    # configure approval/protection on this environment before a public release.
    if: >-
      github.event_name != 'pull_request' &&
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.REMOTEVOICE_ANDROID_RELEASE_ENABLED == 'true'
    environment: android-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Stage explicitly configured signing material
        id: signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.REMOTEVOICE_ANDROID_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.REMOTEVOICE_ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.REMOTEVOICE_ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.REMOTEVOICE_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.REMOTEVOICE_ANDROID_RELEASE_CERT_SHA256 }}
        shell: python
        run: |
          import base64, os, pathlib, re
          names = ('RELEASE_KEYSTORE_B64', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD')
          present = [bool(os.environ.get(name)) for name in names]
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          if not any(present):
              with output.open('a', encoding='utf-8') as stream:
                  stream.write('configured=false\n')
              print('Signing secrets absent; only the unsigned artifact is available.')
              raise SystemExit(0)
          expected = os.environ.get('EXPECTED_CERTIFICATE_SHA256', '').replace(':', '').strip().lower()
          if not all(present) or not re.fullmatch('[0-9a-f]{64}', expected):
              raise SystemExit('Incomplete release signing configuration.')
          try:
              material = base64.b64decode(os.environ['RELEASE_KEYSTORE_B64'], validate=True)
          except Exception:
              raise SystemExit('Invalid release keystore encoding.') from None
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'remotevoice-release-keystore'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as stream:
              stream.write(material)
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
              stream.write('REMOTEVOICE_RELEASE_STORE_FILE=' + str(path) + '\n')
          with output.open('a', encoding='utf-8') as stream:
              stream.write('configured=true\n')
      - name: Build with the configured stable release identity
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          REMOTEVOICE_RELEASE_STORE_PASSWORD: ${{ secrets.REMOTEVOICE_ANDROID_STORE_PASSWORD }}
          REMOTEVOICE_RELEASE_KEY_ALIAS: ${{ secrets.REMOTEVOICE_ANDROID_KEY_ALIAS }}
          REMOTEVOICE_RELEASE_KEY_PASSWORD: ${{ secrets.REMOTEVOICE_ANDROID_KEY_PASSWORD }}
          REMOTEVOICE_RELEASE_CERT_SHA256: ${{ vars.REMOTEVOICE_ANDROID_RELEASE_CERT_SHA256 }}
        run: gradle --no-daemon --no-configuration-cache --console=plain :app:assembleRelease
      - name: Verify actual APK signature and write public identity manifest
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          REMOTEVOICE_RELEASE_CERT_SHA256: ${{ vars.REMOTEVOICE_ANDROID_RELEASE_CERT_SHA256 }}
        run: ./android/scripts/signing-manifest.ps1 -ApkPath android/app/build/outputs/apk/release/app-release.apk -OutputDirectory android/build/signed-release-artifact
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.configured == 'true'
        with:
          name: RemoteVoice-Android-signed-release-candidate
          path: android/build/signed-release-artifact/
          if-no-files-found: error
      - name: Remove ephemeral release keystore
        if: always()
        shell: python
        run: |
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'remotevoice-release-keystore'
          path.unlink(missing_ok=True)
