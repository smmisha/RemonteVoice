name: RemonteVoice
options:
  bundleIdPrefix: dev.remontevoice
  deploymentTarget:
    iOS: "17.0"
targets:
  RemonteVoice:
    type: application
    platform: iOS
    sources:
      - path: RemonteVoice
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.remontevoice.ios
        PRODUCT_NAME: RemonteVoice
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: RemonteVoice/Info.plist
