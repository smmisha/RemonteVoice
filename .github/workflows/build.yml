name: Build RemoteVoice

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    name: Test and package Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install -r requirements.txt pyinstaller
        working-directory: host

      - name: Check Python sources
        run: python -m compileall -q remotevoice ..\tests
        working-directory: host

      - name: Run host tests
        run: python -m unittest discover -s ..\tests -v
        working-directory: host

      - name: Package Windows host
        # Keep the recovery helper a single independent process, without a
        # onefile extraction supervisor sharing the owner's temporary files.
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name RemoteVoice --paths . --specpath build --workpath build\work
          --distpath build\dist --collect-all qrcode --collect-all PIL
          --collect-all soundcard --hidden-import websockets.asyncio.server
          launcher.py
        working-directory: host

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteVoice-Windows
          path: host/build/dist/RemoteVoice/
          if-no-files-found: error

  ios-build:
    name: Build iOS targets on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check strict pairing endpoint fixtures
        working-directory: ios
        run: |
          swiftc RemoteVoice/PairingInfo.swift tests/PairingInfoProbe.swift -o "$RUNNER_TEMP/RemoteVoicePairingProbe"
          "$RUNNER_TEMP/RemoteVoicePairingProbe"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: ios

      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project RemoteVoice.xcodeproj -scheme RemoteVoice
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/RemoteVoiceSimulator"
          CODE_SIGNING_ALLOWED=NO build
        working-directory: ios

      - name: Build unsigned iPhone app
        run: >-
          xcodebuild -project RemoteVoice.xcodeproj -scheme RemoteVoice
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/RemoteVoiceDevice"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        working-directory: ios

      - name: Package unsigned iPhone IPA for AltServer
        run: |
          mkdir -p "$RUNNER_TEMP/RemoteVoiceIPA/Payload"
          ditto "$RUNNER_TEMP/RemoteVoiceDevice/Build/Products/Release-iphoneos/RemoteVoice.app" \
            "$RUNNER_TEMP/RemoteVoiceIPA/Payload/RemoteVoice.app"
          cd "$RUNNER_TEMP/RemoteVoiceIPA"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/RemoteVoice-iPhone-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteVoice-iOS-Simulator
          path: ${{ runner.temp }}/RemoteVoiceSimulator/Build/Products/Release-iphonesimulator/RemoteVoice.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteVoice-iPhone-unsigned
          path: ${{ runner.temp }}/RemoteVoiceDevice/Build/Products/Release-iphoneos/RemoteVoice.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteVoice-iPhone-unsigned-IPA
          path: ${{ runner.temp }}/RemoteVoice-iPhone-unsigned.ipa
          if-no-files-found: error
